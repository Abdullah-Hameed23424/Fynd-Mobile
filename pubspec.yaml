name: fynd
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  animate_do: ^5.1.0
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  flutter_secure_storage: ^11.1.0
  font_awesome_flutter: ^11.0.0
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  loading_animation_widget: ^1.3.0
  top_snackbar_flutter: ^3.4.0
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Bold.otf
